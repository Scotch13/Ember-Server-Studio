name: Bug report
description: Report a reproducible problem without sharing private server data.
body:
  - type: markdown
    attributes:
      value: "Never include tokens, private keys, full server exports, personal IPs or unredacted logs. For vulnerabilities, read SECURITY.md instead."
  - type: input
    id: version
    attributes:
      label: Ember and Windows versions
      placeholder: Ember 1.0.0, Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include server software/version and expected versus actual behavior. Use sanitized examples only.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized log excerpt
      description: Minimum relevant text only. Review for secrets, names, addresses and paths before submitting.
      render: text
